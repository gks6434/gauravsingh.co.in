name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never let two builds race to commit the generated site.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build, validate and commit the site
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history so the generated commit can be pushed back to main.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Image and social-card generation are local authoring steps that write
      # into src/assets (committed), so CI needs runtime deps only.
      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Build and validate
        run: npm run verify

      # Hostinger checks this repository's ROOT out into public_html and cannot
      # run a build, so the generated site has to live at the root alongside the
      # source. This replaces the previous generation with the new one.
      #
      # The list of generated entries comes from the build output itself, so
      # adding or removing a page needs no change here. Source directories
      # (src, content, scripts, .github) never collide with generated names.
      - name: Commit the built site to the repository root
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          echo "Replacing previously generated files:"
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            echo "  - $entry"
            rm -rf -- "./$entry"
          done < <(cd public && ls -A)

          # Copy with tar so dotfiles (.htaccess) come across reliably.
          (cd public && tar cf - .) | tar xf -

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Built site is unchanged — nothing to commit."
            exit 0
          fi

          # [skip ci] is belt-and-braces: pushes made with GITHUB_TOKEN do not
          # trigger workflow runs, so this cannot loop.
          git commit -qm "Build site from ${GITHUB_SHA::7} [skip ci]"
          git push -q origin HEAD:main
          echo "Committed and pushed the generated site."

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Built site committed to \`main\`"
            echo ""
            echo "Source commit: \`${{ github.sha }}\`"
            echo ""
            echo "Hostinger checks \`main\` out into \`public_html\`."
            echo "If auto-deployment is not enabled, press **Redeploy** in hPanel."
          } >> $GITHUB_STEP_SUMMARY
